<!DOCTYPE HTML>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<title>Accueil Produits</title>
	<link rel="stylesheet" type="text/css"
	href="http://localhost:9001/webjars/bootstrap/5.3.8/css/bootstrap.min.css" />
</head>

<body>
	<div>

		<h1 class="text-center">Produits Mcommerce </h1>

	</div>
	<!--  Tableau des produits -->
	<div>
		<table class="table table-striped table-bordered">
			<thead class="thead-dark">
				<tr>
					<th>ID</th>
					<th>Titre</th>
					<th>Description</th>
					<th>Image</th>
					<th>Prix</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<!--	<div th:each="produit : ${produits}" class="col-md-4 my-1">-->

				<tr th:each="produit: ${produits}">
					<td th:text="${produit.id}">Id produit</td>
					<td th:text="${produit.titre}">Titre</td>
					<td th:text="${produit.description}">Description</td>
					<td align="center"><img th:src="${produit.image}"  class="card text-center" style="width: 10rem;" /></td>
					<td th:text="${#numbers.formatCurrency(produit.prix)}" class="number">Prix</td>
					<td>
						<form th:action="@{'/produits/delete/'+${produit.id}}" th:object="${produit}" th:method="delete">
							<input type="submit" class="btn btn-danger" value="Supprimer">
						</form>
						<p></p>
						<form th:action="@{'/produits/update/'+${produit.id}}" th:object="${produit}"
							th:method="update">
							<input type="submit" class="btn btn-success" value="Mettre à jour">
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<script type="text/javascript" src="http://localhost:9001/webjars/bootstrap/5.3.8/js/bootstrap.min.js"></script>
</body>

</html>
