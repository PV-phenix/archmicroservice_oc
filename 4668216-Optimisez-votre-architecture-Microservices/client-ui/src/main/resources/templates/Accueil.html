<!DOCTYPE HTML>

<html xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Mcommerce</title>



  <link rel="stylesheet" type="text/css" href="http://localhost:9000/webjars/bootstrap/5.3.8/css/bootstrap.min.css" />



</head>

<body>





<div class="container">



  <h1>Application Mcommerce</h1>

	<div class="navbar navbar-inverse navbar-fixed-top">
		<div class="container">
        	<div class="navbar-header">
				<a href="http://localhost:9000/lesclients">Les clients</a>	
          		<a href="http://localhost:9000">Les produits</a>
		  		<a href="http://localhost:9000/lescommandes">Les commandes</a></li>
		  		<a href="http://localhost:9000/expeditions">Les expeditions</a></li>
        	</div>
      	</div>
    </div>
 </div>
  <div class="row">

      <div th:each="produit : ${produits}" class="col-md-4 my-1">
			
		<a th:href="@{|/details-produit/${produit.id}|}" >
            <img th:src="${produit.image}"  class="card-img-top" />

            <p th:text= "${produit.titre}"></p>
			
		</a>
       
      </div>

  </div>



</div>





<script type="text/javascript" src="http://localhost:9000/webjars/bootstrap/5.3.8/js/bootstrap.min.js"></script>



</body>

</html>
