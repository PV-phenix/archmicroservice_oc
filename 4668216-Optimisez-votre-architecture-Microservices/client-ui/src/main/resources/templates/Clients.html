<!DOCTYPE HTML>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<title>Clients Mcommerce</title>
	<link rel="stylesheet" type="text/css" href="http://localhost:9000/webjars/bootstrap/5.3.8/css/bootstrap.min.css" />
</head>

<body>
	<div>

		<h1 class="text-center">Mcommerce - Les Clients</h1>

	</div>
	<!--  Tableau des clients -->
	<div>
		<table class="table table-striped table-bordered">
			<thead class="thead-dark">
				<tr>
					<th>Id</th>
					<th>Nom</th>
					<th>Prénom</th>
					<th>Adresse</th>
					<th>Email</th>
				</tr>
			</thead>
			<tbody>
				<!--	<div th:each="client : ${clients}" class="col-md-4 my-1">-->

				<tr th:each="client: ${clients}">
				<td th:text="${client.id}">Id</td>
				<td th:text="${client.nom}">Nom</td>
					<td th:text="${client.prenom}">Prénom</td>
					<td th:text="${client.adresse}">Adresse</td>
					<td th:text="${client.email}">Email</td>
					<td>
						<form th:action="@{'/lesclients/del/'+${client.id}}" th:object="${client}" th:method="delete">
							<input type="submit" class="btn btn-danger" value="Supprimer">
						</form>
						<p></p>
						<form th:action="@{'/lesclients/find/'+${client.id}}" th:object="${client}"
							th:method="post">
							<input type="submit" class="btn btn-success" value="Mettre à jour">
						</form>


					</td>
				</tr>

			</tbody>
		</table>
	</div>

	<script type="text/javascript" src="http://localhost:9000/webjars/bootstrap/5.3.8/js/bootstrap.min.js"></script>
</body>

</html>
